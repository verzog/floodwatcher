# Flood Watcher checks: PHP syntax on every PHP version the app supports, the page script's
# syntax, and (for version tags) that the tag matches version.php.
name: Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, xml, pdo_mysql, openssl
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Page script syntax
        run: node --check www/app.js && node --check www/sw.js

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version.php
        run: |
          want="v$(php -r 'echo require "version.php";')"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version.php ($want)." >&2
            exit 1
          fi
